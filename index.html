<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Landing</title>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@700&family=Libre+Franklin:wght@400;700&display=swap" rel="stylesheet">
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Reset & base */
    body {
      margin: 0;
      font-family: 'Libre Franklin', sans-serif;
      color: maroon;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
      background: url("assets/landingbg.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body {
        background: url("assets/landingbg.jpg") no-repeat center center fixed;
        background-size: cover;
        color: lightgrey;
      }
    }

    /* Overlay for readability */
    body::before {
      content: "";
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4); /* dark overlay */
      z-index: -1;
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      position: relative;
      z-index: 1;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: red;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    nav a {
      text-decoration: none;
      color: inherit;
      font-weight: 500;
    }

    /* Center name */
    main {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      z-index: 1;
      text-align: center;
    }
    .hero-name {
      font-family: 'Libre Baskerville', serif;
      font-size: 4rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: maroon;
    }
    .role {
      font-family: 'Libre Franklin', sans-serif;
      font-size: 1.5rem;
      margin-top: 10px;
      color: white;
    }

    /* Footer icons */
    footer {
      position: absolute;
      bottom: 20px;
      right: 20px;
      z-index: 1;
    }
    .social-icons a {
      margin-left: 15px;
      font-size: 1.5rem;
      color: red;
    }
  </style>
</head>
<body>
  <!-- Logo & Menu -->
  <header>
    <div class="logo">Fello.</div>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#resume">Resume</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <!-- Center Name -->
  <main>
    <div>
      <h1 class="hero-name">Felix Baraka Mwiti</h1>
      <p class="role">Sales Professional & Content Creator</p>
    </div>
  </main>

  <!-- Social Icons -->
  <footer>
    <div class="social-icons">
      <a href="#"><i class="fab fa-instagram"></i></a>
      <a href="#"><i class="fab fa-linkedin"></i></a>
      <a href="#"><i class="fab fa-reddit"></i></a>
      <a href="mailto:yourmail@gmail.com"><i class="fas fa-envelope"></i></a>
      <a href="#"><i class="fab fa-pinterest"></i></a>
    </div>
  </footer>
</body>
