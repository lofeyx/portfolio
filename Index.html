<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio Landing</title>
  <!-- Font Awesome for icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    /* Base styles */
    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: white;
      color: maroon;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    /* Dark mode */
    @media (prefers-color-scheme: dark) {
      body {
        background: black;
        color: lightgrey;
      }
    }

    /* Header */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
    }
    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: red;
    }
    nav ul {
      list-style: none;
      display: flex;
      gap: 20px;
      margin: 0;
      padding: 0;
    }
    nav a {
      text-decoration: none;
      color: inherit;
      font-weight: 500;
    }

    /* Center name */
    main {
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .hero-name {
      font-size: 4rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 5px;
      color: maroon;
    }

    /* Footer icons */
    footer {
      position: absolute;
      bottom: 20px;
      right: 20px;
    }
    .social-icons a {
      margin-left: 15px;
      font-size: 1.5rem;
      color: red;
    }
  </style>
</head>
<body>
  <!-- Logo -->
  <header>
    <div class="logo">Fello.</div>
    <nav>
      <ul>
        <li><a href="#about">About</a></li>
        <li><a href="#resume">Resume</a></li>
        <li><a href="#projects">Projects</a></li>
        <li><a href="#contact">Contact Us</a></li>
      </ul>
    </nav>
  </header>

  <!-- Center Name -->
  <main>
    <h1 class="hero-name">Felix Baraka Mwiti</h1>
  </main>

  <!-- Social Icons -->
  <footer>
    <div class="social-icons">
      <a href="#"><i class="fab fa-twitter"></i></a>
      <a href="#"><i class="fab fa-linkedin"></i></a>
      <a href="#"><i class="fab fa-github"></i></a>
    </div>
  </footer>
</body>
</html>
